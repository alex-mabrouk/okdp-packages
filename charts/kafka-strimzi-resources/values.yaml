nameOverride: ""
fullnameOverride: ""

kafka:
  # -- Kafka broker version. Must be one supported by the installed Strimzi operator.
  version: "4.3.1"
  # -- Combined controller+broker node pool replica count. 1 = no HA.
  replicas: 1
  storage:
    class: ""
    size: 10Gi
  resources:
    requests:
      cpu: "0.5"
      memory: "2Gi"
    limits:
      cpu: "1"
      memory: "2Gi"

# -- SASL/SCRAM-SHA-512 users, authenticated over the TLS listener.
saslUsers: []
# - username: demo
#   password: demo12345

# -- Topics provisioned via the entity operator's topic operator.
topics: []
# - name: demo-topic
#   partitions: 1
#   replicationFactor: 1
