apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: combined
  labels:
    {{- include "kafka-strimzi-resources.labels" . | nindent 4 }}
    strimzi.io/cluster: {{ include "kafka-strimzi-resources.fullname" . }}
spec:
  replicas: {{ .Values.kafka.replicas }}
  roles:
    - controller
    - broker
  resources:
    {{- toYaml .Values.kafka.resources | nindent 4 }}
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: {{ .Values.kafka.storage.size | quote }}
        deleteClaim: false
        {{- if .Values.kafka.storage.class }}
        class: {{ .Values.kafka.storage.class | quote }}
        {{- end }}
