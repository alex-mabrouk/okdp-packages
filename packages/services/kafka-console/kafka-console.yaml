# Redpanda Console — read-only browsing UI for an existing Kafka instance
# (topics, live message tail, consumer groups). Authenticates to Kafka with
# SASL/SCRAM-SHA-512 over TLS (matching the Strimzi-backed kafka package),
# trusting that instance's own cluster CA. Its own web UI has no login in
# front of it: anything that can reach the ingress can browse topics and
# messages. Not meant to carry sensitive data as-is.
apiVersion: v1alpha1
name: kafka-console
tag: 3.9.0-p04
protected: false
description: |
  Redpanda Console — web UI to browse an existing Kafka instance (topics, live
  message tail, consumer groups). Works against vanilla Apache Kafka, not just Redpanda.
schema:
  parameters:
    properties:
      kafkaInstanceName:
        type: string
        default: "kafka"
        description: "Name of the Kafka instance to connect to (must be deployed in the same project)"
      memoryGi: { title: "Sizing | Memory (GiB) | | order:1 columns:2", type: number, required: true, default: 0.5 }
      cpu: { title: "Sizing | CPU (vCPU) | | order:2 columns:2", type: number, required: true, default: 0.25, multipleOf: 0.25, description: "CPU request for the console container. The limit is set to twice this value." }
      saslUsername: { title: "Access | SASL username | | order:3 columns:2", type: string, required: true, description: "Must match one of the kafka instance's saslUsers entries." }
      saslPassword: { title: "Access | SASL password | | order:4 columns:2", type: string, required: true }
  context:
    properties:
      certificateIssuers:
        required: true
        properties:
          selfSigned:
            properties:
              name: { type: string, required: true }
      ingress:
        required: true
        properties:
          suffix: { type: string, required: true }
modules:
  - name: main
    timeout: 10m
    source:
      helmRepository:
        url: https://charts.redpanda.com
        chart: console
        version: 3.9.0
    values: |
      {{- $ns := .Release.spec.targetNamespace -}}
      {{- $host := printf "%s-%s.%s" (trimPrefix (printf "%s-" $ns) .Release.metadata.name) $ns .Context.ingress.suffix -}}
      {{- $kafkaCluster := printf "%s-%s-main" $ns .Parameters.kafkaInstanceName -}}
      {{- $brokers := printf "%s-kafka-bootstrap.%s.svc.cluster.local:9093" $kafkaCluster $ns -}}

      config:
        kafka:
          brokers:
            - "{{ $brokers }}"
          sasl:
            enabled: true
            mechanism: SCRAM-SHA-512
            username: "{{ .Parameters.saslUsername }}"
          tls:
            enabled: true
            caFilepath: /etc/console/certs/ca.crt
      secretMounts:
        - name: kafka-ca
          secretName: "{{ $kafkaCluster }}-cluster-ca-cert"
          path: /etc/console/certs
          defaultMode: 0440
      secret:
        kafka:
          saslPassword: "{{ .Parameters.saslPassword }}"
      resources:
        requests:
          cpu: "{{ printf "%.0fm" (mulf (float64 .Parameters.cpu) 1000) }}"
          memory: "{{ printf "%.0fMi" (mulf .Parameters.memoryGi 1024) }}"
        limits:
          cpu: "{{ printf "%.0fm" (mulf (float64 .Parameters.cpu) 2000) }}"
          memory: "{{ printf "%.0fMi" (mulf .Parameters.memoryGi 1024) }}"

      ingress:
        enabled: true
        className: nginx
        annotations:
          cert-manager.io/cluster-issuer: "{{ .Context.certificateIssuers.selfSigned.name }}"
        hosts:
          - host: {{ $host }}
            paths:
              - path: /
                pathType: Prefix
        tls:
          - hosts:
              - {{ $host }}
            secretName: {{ .Release.metadata.name }}-tls
