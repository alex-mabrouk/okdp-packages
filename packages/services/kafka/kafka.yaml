# KRaft Kafka (no Zookeeper) via the Strimzi operator, internal to the cluster
# only: no ingress, no external listener. Meant for platform-internal event
# streams (a Spark Structured Streaming consumer, a producer Deployment), not
# for a client outside the cluster.
# Client access is authenticated (SASL/SCRAM-SHA-512) and encrypted (TLS on
# the client listener). Requires the strimziKafkaOperator role to be deployed
# first — see the strimzi-kafka-operator system package.
apiVersion: v1alpha1
name: kafka
tag: 32.4.3-p05
protected: false
description: |
  Apache Kafka (KRaft mode, Strimzi operator) for platform-internal event streams.
usage:
  text: |
    Kafka is reachable only from inside the cluster (no ingress):
      bootstrap server: {{ .Release.metadata.name }}-main-kafka-bootstrap.{{ .Release.spec.targetNamespace }}.svc.cluster.local:9093
    Authenticated via SASL/SCRAM-SHA-512 with the configured users, over TLS
    (the cluster's own CA — see the `<bootstrap-name>-cluster-ca-cert` secret).
    Do not expose this Release outside the cluster as-is.
schema:
  parameters:
    properties:
      dataStorage: { title: "Storage | Data size | | order:1 columns:2", type: string, required: true, default: "10Gi" }
      memoryGi: { title: "Sizing | Memory (GiB) | | order:2 columns:2", type: number, required: true, default: 2 }
      cpu: { title: "Sizing | CPU (vCPU) | | order:3 columns:2", type: number, required: true, default: 0.5, multipleOf: 0.25, description: "CPU request for the broker container. The limit is set to twice this value." }
      replicaCount: { title: "Sizing | Broker count | | order:4 columns:2", type: integer, required: true, default: 1, minimum: 1, description: "Combined controller+broker KRaft nodes. Set to 3 (or more, odd) for controller quorum HA; 1 has no fault tolerance. Bumping this also requires raising the topic/transaction replication factors in the kafka-strimzi-resources chart." }
      saslUsers:
        title: "Access | SASL users | | order:2"
        type: array
        required: true
        minItems: 1
        description: "SASL/SCRAM-SHA-512 credentials for client access (e.g. one per consumer/producer, or one shared with kafka-console)."
        items:
          properties:
            username: { type: string, required: true }
            password: { type: string, required: true }
      # Topics provisioned at install/upgrade.
      topics:
        title: "Topics | Topics | | order:1"
        type: array
        items:
          properties:
            name: { type: string, required: true }
            partitions: { type: integer, default: 1 }
            replicationFactor: { type: integer, default: 1 }
  context:
    properties:
      storageClass:
        required: true
        properties:
          data: { type: string, required: true }
modules:
  - name: main
    timeout: 15m
    source:
      local:
        path: ../../../charts/kafka-strimzi-resources
    values: |
      kafka:
        version: "4.3.1"
        replicas: {{ .Parameters.replicaCount }}
        storage:
          class: "{{ .Context.storageClass.data }}"
          size: "{{ .Parameters.dataStorage }}"
        resources:
          requests:
            cpu: "{{ .Parameters.cpu }}"
            memory: "{{ .Parameters.memoryGi }}Gi"
          limits:
            cpu: "{{ mulf (float64 .Parameters.cpu) 2 }}"
            memory: "{{ .Parameters.memoryGi }}Gi"
      saslUsers:
        {{- range .Parameters.saslUsers }}
        - username: {{ .username | quote }}
          password: {{ .password | quote }}
        {{- end }}
      topics:
        {{- range .Parameters.topics }}
        - name: {{ .name | quote }}
          partitions: {{ .partitions | default 1 }}
          replicationFactor: {{ .replicationFactor | default 1 }}
        {{- end }}
roles: []
dependencies:
  - strimziKafkaOperator
