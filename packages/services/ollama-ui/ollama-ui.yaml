apiVersion: v1alpha1
name: ollama-ui
tag: 16.1.0-p03
description: |
  Open WebUI — self-hosted chat interface for Ollama.
  Connects to an existing ollama instance deployed in the same project.
  Includes conversation history, model management, and user accounts.

schema:
  parameters:
    properties:
      ollamaInstanceName:
        type: string
        default: "ollama"
        description: "Name of the Ollama instance to connect to (must be deployed in the same project)"
      storageGi:
        type: integer
        default: 2
        description: "Persistent volume size for conversations, settings and user data (GiB)"
      oidcAllowedRoles:
        type: string
        default: "data_engineer,data_scientist,business_analyst,data_steward,auditor,platform_admin"
        description: "Comma-separated claim values allowed to sign in"
      oidcAdminRoles:
        type: string
        default: "platform_admin"
        description: "Comma-separated claim values granted the Open WebUI admin role"
      oidcRolesClaim:
        type: string
        default: "groups"
        description: "Token claim carrying the values matched against the role lists"
      caBundleSecret:
        type: string
        default: "certs-bundle"
        description: "Secret holding ca.crt, trusted when the backend calls the OIDC issuer"
  context:
    properties:
      oidc:
        required: true
        properties:
          issuerUri: { type: string, required: true }
          enabled: { type: boolean, default: true }
          displayName: { type: string, default: keycloak }
          scope: { type: string, default: "openid profile email groups" }
          clientProvisioning: { type: string, default: existing }
          # Read only when clientProvisioning is dcr.
          dcr:
            properties:
              registrationUrl: { type: string }
              authMethod: { type: string }
      certificateIssuers:
        required: true
        properties:
          selfSigned:
            properties:
              name: { type: string, required: true }
      ingress:
        required: true
        properties:
          suffix: { type: string, required: true }
      storageClass:
        required: true
        properties:
          workspace: { type: string, required: true }

modules:
  # Registers the OIDC client through anonymous Dynamic Client Registration.
  # Active only when the platform provisions clients that way; the credentials
  # land in a Secret carrying the same keys the deployment reads.
  - name: oidc-dcr
    # toString, not default: `false | default true` is true, sprig treats false as empty.
    enabled: '{{ and (ne (.Context.oidc.enabled | toString) "false") (eq (.Context.oidc.clientProvisioning | default "existing") "dcr") }}'
    timeout: 10m
    source:
      oci:
        repository: quay.io/adaltas/oidc-dcr
        tag: 0.3.2
    values: |
      {{- $namespace := printf "%v" .Release.spec.targetNamespace -}}
      {{- $release := printf "%v" .Release.metadata.name -}}
      {{- $host := printf "%s-%s.%s" (trimPrefix (printf "%s-" $namespace) $release) $namespace .Context.ingress.suffix -}}
      {{- $dcr := .Context.oidc.dcr | default dict -}}
      {{- if ne ($dcr.authMethod | default "") "anonymous" }}
      {{- fail (printf "oidc.dcr.authMethod %q is not supported: this package registers anonymously" ($dcr.authMethod | default "")) }}
      {{- end }}

      ttl_seconds: 30
      registration_url: {{ $dcr.registrationUrl | quote }}
      request:
        application_type: web
        client_name: "{{ $release }}-{{ $namespace }}"
        redirect_uris:
          - "https://{{ $host }}/oauth/oidc/callback"
        grant_types:
          - "authorization_code"
          - "client_credentials"
        scope: {{ .Context.oidc.scope | quote }}
      tls:
        insecure: false
        certificate: "{{ .Parameters.caBundleSecret | default \"certs-bundle\" }}"
      secret: "{{ $release }}-{{ $namespace }}-dcr"
      mapping:
        use_default: false
        key_mapping:
          client_id: ".client_id"
          client_secret: ".client_secret"

  - name: main
    timeout: 10m
    source:
      helmRepository:
        url: https://helm.openwebui.com/
        chart: open-webui
        version: 16.1.0
    values: |
      {{- /* Host convention is <release without its project prefix>-<project>: the
             console prefixes instances with their project, which would double it. */ -}}
      {{- $ns := .Release.spec.targetNamespace -}}
      {{- $host := printf "%s-%s.%s" (trimPrefix (printf "%s-" $ns) .Release.metadata.name) $ns .Context.ingress.suffix -}}
      {{- $oidcEnabled := true -}}
      {{- if hasKey .Context.oidc "enabled" }}{{- $oidcEnabled = .Context.oidc.enabled -}}{{ end -}}
      {{- $oidcScope := .Context.oidc.scope | default "openid profile email groups" -}}
      {{- $oidcDisplayName := .Context.oidc.displayName | default "keycloak" -}}
      {{- /* In dcr mode the registration job writes the credentials, under the same keys. */ -}}
      {{- $oauthSecret := printf "creds-%s-oauth2" .Release.metadata.name -}}
      {{- if eq (.Context.oidc.clientProvisioning | default "existing") "dcr" -}}
      {{- $oauthSecret = printf "%s-%s-dcr" .Release.metadata.name $ns -}}
      {{- end -}}
      {{- $caSecret := .Parameters.caBundleSecret | default "certs-bundle" -}}
      ollama:
        enabled: false

      pipelines:
        enabled: false

      websocket:
        enabled: false

      ollamaUrls:
        - http://{{ .Release.spec.targetNamespace }}-{{ .Parameters.ollamaInstanceName }}-main.{{ .Release.spec.targetNamespace }}.svc.cluster.local:11434

      persistence:
        enabled: true
        size: "{{ .Parameters.storageGi }}Gi"
        storageClass: "{{ .Context.storageClass.workspace }}"

      ingress:
        enabled: true
        class: nginx
        annotations:
          cert-manager.io/cluster-issuer: "{{ .Context.certificateIssuers.selfSigned.name }}"
        host: {{ $host }}
        tls: true
        existingSecret: {{ .Release.metadata.name }}-tls

      {{- if $oidcEnabled }}
      sso:
        enabled: true
        enableSignup: true
        mergeAccountsByEmail: true
        enableRoleManagement: true
        oidc:
          enabled: true
          clientExistingSecret: {{ $oauthSecret }}
          clientIdExistingSecretKey: client_id
          clientExistingSecretKey: client_secret
          providerUrl: "{{ .Context.oidc.issuerUri }}/.well-known/openid-configuration"
          providerName: "{{ $oidcDisplayName }}"
          scopes: "{{ $oidcScope }}"
        roleManagement:
          rolesClaim: "{{ .Parameters.oidcRolesClaim }}"
          allowedRoles: "{{ .Parameters.oidcAllowedRoles }}"
          adminRoles: "{{ .Parameters.oidcAdminRoles }}"

      {{- end }}

      extraEnvVars:
        - { name: ENABLE_TITLE_GENERATION, value: "False" }
        - { name: ENABLE_TAGS_GENERATION, value: "False" }
        - { name: ENABLE_AUTOCOMPLETE_GENERATION, value: "False" }
        - { name: ENABLE_RETRIEVAL_QUERY_GENERATION, value: "False" }
        {{- if $oidcEnabled }}
        # The backend builds the OAuth redirect_uri from this, not from the request.
        # Accounts appear on first provider login; the local form stays off.
        - name: WEBUI_URL
          value: "https://{{ $host }}"
        - name: ENABLE_LOGIN_FORM
          value: "false"
        - name: REQUESTS_CA_BUNDLE
          value: /cacerts/ca.crt
        - name: SSL_CERT_FILE
          value: /cacerts/ca.crt
        {{- end }}

      {{- if $oidcEnabled }}
      volumes:
        - name: cacerts
          secret:
            secretName: {{ $caSecret }}

      volumeMounts:
        container:
          - name: cacerts
            mountPath: /cacerts
      {{- end }}

      # Open WebUI loads a local sentence-transformers embedding model (all-MiniLM-L6-v2, ~600MB
      # resident) on top of the backend at startup → it OOMKills (exit 137) under a 1Gi limit,
      # crash-looping. The model is cached on the data PVC (/app/backend/data), so 2Gi lets it load
      # once and run stably. (To drop the local model entirely instead, set RAG_EMBEDDING_ENGINE=ollama.)
      resources:
        requests:
          cpu: "200m"
          memory: "1Gi"
        limits:
          memory: "2Gi"
