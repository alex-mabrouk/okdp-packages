# RustFS storage adapter. Produces one s3 Connection (output "s3"), consumes none.
apiVersion: v1alpha1
name: rustfs
tag: 1.0.0-rc.3-p09
protected: false
description: |
  RustFS is a high-performance, S3-compatible distributed object storage written in Rust.
usage:
  text: |
    {{- $host := printf "%s-%s" (trimPrefix (printf "%s-" .Release.spec.targetNamespace) .Release.metadata.name) .Release.spec.targetNamespace -}}
    RustFS S3-compatible object storage.
    S3 endpoint : https://{{ $host }}-api.{{ .Context.ingress.suffix }}
    Console     : https://{{ $host }}.{{ .Context.ingress.suffix }}

    First install with SSO on: the provisioning job registers the identity
    provider after the server has started, and the admin config store is only
    read at startup. Restart it once to activate the Keycloak button:
      kubectl -n {{ .Release.spec.targetNamespace }} rollout restart deploy/{{ .Release.metadata.name }}
schema:
  parameters:
    properties:
      rootAccessKey: { title: "Admin | Root access key | | order:1 columns:2", type: string, required: true, default: "okdpadmin", minLength: 3, maxLength: 20 }
      # No default: a secret key shipped with a package ends up in production.
      rootSecretKey: { title: "Admin | Root secret key | | order:2 columns:2", type: string, required: true, minLength: 8, maxLength: 40 }
      dataStorage: { title: "Storage | Data size | | order:1 columns:2", type: string, required: true, default: "5Gi" }
      caBundleSecret: { title: "Storage | CA bundle Secret | | order:3 advanced:true", type: string, required: true, default: "certs-bundle", description: "Secret holding ca.crt, trusted by the server when it calls the OIDC issuer." }
      mcImage: { title: "Storage | Provisioning image | | order:2 columns:2 advanced:true", type: string, required: true, default: "minio/mc:latest" }
      # S3 identities of the store, one entry per principal. actions are the
      # neutral verbs (read, list, write, admin), scoped to buckets when
      # buckets is set. sts marks a principal that needs full admin rights.
      grants:
        title: "Access | Grants | | order:1"
        type: array
        items:
          properties:
            principal: { type: string, required: true }
            credentialsSecret:
              required: true
              properties:
                name: { type: string, required: true }
                accessKeyKey: { type: string, required: true }
                secretKeyKey: { type: string, required: true }
            actions:
              type: array
              items: { type: string }
            buckets:
              type: array
              items: { type: string }
            sts: { type: boolean, default: false }
      # Claim carrying the policy names. Every one of its values must name an
      # existing policy or the login is refused, so point it at a claim built
      # for that purpose rather than at one carrying application roles.
      oidcPolicyClaim: { title: "Access | OIDC policy claim | | order:4 advanced:true", type: string, required: true, default: "groups" }
      # Requested on top of the platform scopes when the client is registered through dcr. A claim built for the store is rarely part of the default scopes, and the provider omits it unless its scope is asked for.
      oidcPolicyScope: { title: "Access | OIDC policy scope | | order:5 advanced:true", type: string, default: "", description: "Client scope requested so the policy claim is issued. Read only when oidc.clientProvisioning is dcr." }
      oidcPolicies:
        title: "Access | OIDC policies | | order:3"
        type: array
        items:
          properties:
            name: { type: string, required: true }
            actions:
              type: array
              items: { type: string }
            buckets:
              type: array
              items: { type: string }
      # Buckets created at startup. paths seeds prefixes inside the bucket for
      # consumers that require them to exist beforehand.
      buckets:
        title: "Access | Buckets | | order:2"
        type: array
        items:
          properties:
            name: { type: string, required: true }
            anonymousRead: { type: boolean, default: false }
            paths:
              type: array
              items: { type: string }
  context:
    properties:
      oidc:
        required: true
        properties:
          issuerUri: { type: string, required: true }
          enabled: { type: boolean, default: true }
          displayName: { type: string, default: keycloak }
          scope: { type: string, default: "openid profile email groups" }
          clientProvisioning: { type: string, default: existing }
          # Read only when clientProvisioning is dcr.
          dcr:
            properties:
              registrationUrl: { type: string }
              authMethod: { type: string }
      certificateIssuers:
        required: true
        properties:
          selfSigned:
            properties:
              name: { type: string, required: true }
      storageClass:
        required: true
        properties:
          data: { type: string, required: true }
      ingress:
        required: true
        properties:
          suffix: { type: string, required: true }
modules:
  # Registers the OIDC client through anonymous Dynamic Client Registration. Active only when the platform provisions clients that way.
  - name: oidc-dcr
    # toString, not default: `false | default true` is true, sprig treats false as empty.
    enabled: '{{ and (ne (.Context.oidc.enabled | toString) "false") (eq (.Context.oidc.clientProvisioning | default "existing") "dcr") }}'
    timeout: 10m
    source:
      oci:
        repository: quay.io/adaltas/oidc-dcr
        tag: 0.3.2
    values: |
      {{- $ns := printf "%v" .Release.spec.targetNamespace -}}
      {{- $release := printf "%v" .Release.metadata.name -}}
      {{- /* Same base as the ingress hosts of the main module: the console strips the project prefix it adds to instance names, so the client is named after what the DNS shows, not after the Release. */ -}}
      {{- $base := trimPrefix (printf "%s-" $ns) $release -}}
      {{- $consoleHost := printf "%s-%s.%s" $base $ns .Context.ingress.suffix -}}
      {{- $caSecret := .Parameters.caBundleSecret | default "certs-bundle" -}}
      {{- $dcr := .Context.oidc.dcr | default dict -}}
      {{- /* The mode is tested again here: values are rendered even when the module is disabled. */ -}}
      {{- if and (eq (.Context.oidc.clientProvisioning | default "existing") "dcr") (ne ($dcr.authMethod | default "") "anonymous") }}
      {{- fail (printf "oidc.dcr.authMethod %q is not supported: this package registers anonymously" ($dcr.authMethod | default "")) }}
      {{- end }}
      {{- /* The policy claim rides its own scope, which the platform scopes do not carry. */ -}}
      {{- $scope := .Context.oidc.scope | default "openid profile email groups" -}}
      {{- with .Parameters.oidcPolicyScope }}{{- $scope = printf "%s %s" $scope . -}}{{- end }}
      {{- $scope = without (splitList " " $scope) "openid" | join " " -}}

      ttl_seconds: 30
      registration_url: {{ $dcr.registrationUrl | quote }}
      request:
        application_type: web
        client_name: "{{ $base }}-{{ $ns }}"
        redirect_uris:
          - "https://{{ $consoleHost }}/rustfs/admin/v3/oidc/callback/default"
        grant_types:
          - "authorization_code"
          - "client_credentials"
        scope: {{ $scope | quote }}
      tls:
        insecure: false
        certificate: "{{ $caSecret }}"
      secret: "{{ $release }}-{{ $ns }}-dcr"
      mapping:
        use_default: false
        key_mapping:
          client_id: ".client_id"
          client_secret: ".client_secret"

  - name: main
    timeout: 10m
    source:
      helmRepository:
        url: https://charts.rustfs.com
        chart: rustfs
        version: 1.0.0-rc.3
    values: |
      {{- $release := printf "%v" .Release.metadata.name -}}
      {{- $ns := printf "%v" .Release.spec.targetNamespace -}}
      {{- $domain := printf "%v" .Context.ingress.suffix -}}
      {{- $issuer := .Context.certificateIssuers.selfSigned.name -}}

      {{- $grants := .Parameters.grants | default list -}}
      {{- $buckets := .Parameters.buckets | default list -}}
      {{- $oidcPolicies := .Parameters.oidcPolicies | default list -}}
      {{- $oidcPolicyClaim := .Parameters.oidcPolicyClaim | default "groups" -}}

      {{- $oidcEnabled := true -}}
      {{- if hasKey .Context.oidc "enabled" }}{{- $oidcEnabled = .Context.oidc.enabled -}}{{ end -}}
      {{- $oidcScopes := .Context.oidc.scope | default "openid profile email groups" | replace " " "," -}}
      {{- $oidcDisplayName := .Context.oidc.displayName | default "keycloak" -}}
      {{- /* In dcr mode the registration job writes the credentials, under the same keys. */ -}}
      {{- $oauthSecret := printf "creds-%s-oauth2" $release -}}
      {{- if eq (.Context.oidc.clientProvisioning | default "existing") "dcr" -}}
      {{- $oauthSecret = printf "%s-%s-dcr" $release $ns -}}
      {{- end -}}
      {{- $oidcDiscoveryUrl := printf "%s/.well-known/openid-configuration" .Context.oidc.issuerUri -}}
      {{- /* The SSRF guard refuses any origin that resolves to a private address. */ -}}
      {{- $issuerParts := splitList "/" .Context.oidc.issuerUri -}}
      {{- $oidcOrigin := printf "%s//%s" (index $issuerParts 0) (index $issuerParts 2) -}}
      {{- $caSecret := .Parameters.caBundleSecret | default "certs-bundle" -}}

      {{- /* Hosts derive from the Release, never from the product name, so a store
             deployed under a neutral name takes over that name's ingress (a Release
             'storage' in 'default' serves storage-default). The console prefixes its
             instances with their project, which would double the namespace: strip it. */ -}}
      {{- $base := trimPrefix (printf "%s-" $ns) $release -}}
      {{- $s3Host := printf "%s-%s-api.%s" $base $ns $domain -}}
      {{- $consoleHost := printf "%s-%s.%s" $base $ns $domain -}}

      {{- $svc := printf "%s-svc" $release -}}
      {{- $rootSecret := printf "%s-secret" $release -}}
      {{- $endpoint := printf "http://%s.%s:9000" $svc $ns -}}

      {{- /* neutral verb -> S3 actions (admin handled separately via consoleAdmin).
             Verbs are matched case-insensitively: the same grants block must apply
             to any store backend, whatever casing its own package documents. */ -}}
      {{- $verbMap := dict
          "read"  (list "s3:GetObject" "s3:GetBucketLocation")
          "list"  (list "s3:ListBucket" "s3:ListAllMyBuckets")
          "write" (list "s3:PutObject" "s3:DeleteObject" "s3:AbortMultipartUpload") -}}

      nameOverride: "{{ $release }}"
      fullnameOverride: "{{ $release }}"

      # Single-node (standalone). Kind provides the `standard` storageClass via platform context.
      mode:
        standalone:
          enabled: true
        distributed:
          enabled: false
      replicaCount: 1
      storageclass:
        name: "{{ .Context.storageClass.data }}"
        dataStorageSize: "{{ .Parameters.dataStorage }}"
        logStorageSize: "256Mi"

      secret:
        rustfs:
          access_key: "{{ .Parameters.rootAccessKey }}"
          secret_key: "{{ .Parameters.rootSecretKey }}"

      {{- if $oidcEnabled }}
      extraEnv:
        - name: RUSTFS_BROWSER_REDIRECT_URL
          value: "https://{{ $consoleHost }}"
        - name: RUSTFS_OUTBOUND_ALLOW_ORIGINS
          value: "{{ $oidcOrigin }}"
        - name: SSL_CERT_FILE
          value: /cacerts/ca.crt

      extraVolumes:
        - name: cacerts
          secret:
            secretName: {{ $caSecret }}

      extraVolumeMounts:
        - name: cacerts
          mountPath: /cacerts

      # Restart the server when the provider settings change
      podAnnotations:
        okdp.io/oidc-config: "{{ printf "%s|%s|%s|%s" $oidcDiscoveryUrl $oidcScopes $consoleHost $oidcPolicyClaim | sha256sum | trunc 16 }}"
      {{- end }}

      # The chart's own ingress targets the console port; we manage BOTH ingresses (S3 + console)
      # ourselves via extraManifests so the S3 API is exposed on the endpoint port (9000).
      ingress:
        enabled: false

      # -- Adapter-owned manifests: S3 API ingress + console ingress + provisioning (ConfigMap + Job).
      extraManifests:
        # ---- S3 API ingress (endpoint port 9000) ----
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: {{ $release }}-s3
            namespace: {{ $ns }}
            annotations:
              cert-manager.io/cluster-issuer: "{{ $issuer }}"
              nginx.ingress.kubernetes.io/proxy-body-size: "0"
          spec:
            ingressClassName: nginx
            rules:
              - host: {{ $s3Host }}
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: {{ $svc }}
                          port:
                            name: endpoint
            tls:
              - hosts: [{{ $s3Host }}]
                secretName: {{ $release }}-s3-tls
        # ---- Console ingress (console port 9001) ----
        - apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: {{ $release }}-console
            namespace: {{ $ns }}
            annotations:
              cert-manager.io/cluster-issuer: "{{ $issuer }}"
              nginx.ingress.kubernetes.io/proxy-body-size: "0"
          spec:
            ingressClassName: nginx
            rules:
              - host: {{ $consoleHost }}
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: {{ $svc }}
                          port:
                            name: console
            tls:
              - hosts: [{{ $consoleHost }}]
                secretName: {{ $release }}-console-tls
        # ---- Provisioning: buckets + users + policies from the grants ----
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: {{ $release }}-provision
            namespace: {{ $ns }}
          data:
            {{- /* one IAM policy file per non-admin grant */ -}}
            {{- range $g := $grants }}
            {{- $verbs := list }}{{- range $v := ($g.actions | default list) }}{{- $verbs = append $verbs (lower $v) }}{{- end }}
            {{- $isAdmin := or ($g.sts | default false) (has "admin" $verbs) }}
            {{- if not $isAdmin }}
            {{- $actions := list }}
            {{- range $v := $verbs }}{{- with (index $verbMap $v) }}{{- $actions = concat $actions . }}{{- end }}{{- end }}
            {{- $resources := list }}
            {{- range $b := ($g.buckets | default (list "*")) }}
            {{- if eq $b "*" }}{{- $resources = concat $resources (list "arn:aws:s3:::*" "arn:aws:s3:::*/*") }}
            {{- else }}{{- $resources = concat $resources (list (printf "arn:aws:s3:::%s" $b) (printf "arn:aws:s3:::%s/*" $b)) }}{{- end }}
            {{- end }}
            policy-{{ $g.principal }}.json: |
              {{ dict "Version" "2012-10-17" "Statement" (list (dict "Effect" "Allow" "Action" ($actions | uniq) "Resource" ($resources | uniq))) | toJson }}
            {{- end }}
            {{- end }}
            {{- /* one policy file per OIDC policy, named after the claim value */ -}}
            {{- range $p := $oidcPolicies }}
            {{- $verbs := list }}{{- range $v := ($p.actions | default list) }}{{- $verbs = append $verbs (lower $v) }}{{- end }}
            {{- $isAdmin := has "admin" $verbs }}
            {{- $resources := list }}
            {{- range $b := ($p.buckets | default (list "*")) }}
            {{- if eq $b "*" }}{{- $resources = concat $resources (list "arn:aws:s3:::*" "arn:aws:s3:::*/*") }}
            {{- else }}{{- $resources = concat $resources (list (printf "arn:aws:s3:::%s" $b) (printf "arn:aws:s3:::%s/*" $b)) }}{{- end }}
            {{- end }}
            {{- $statements := list }}
            {{- if $isAdmin }}
            {{- /* RustFS rejects s3: and admin: actions mixed in one statement. */ -}}
            {{- $statements = list (dict "Effect" "Allow" "Action" (list "s3:*") "Resource" ($resources | uniq)) (dict "Effect" "Allow" "Action" (list "admin:*") "Resource" (list "arn:aws:s3:::*")) }}
            {{- else }}
            {{- $actions := list }}
            {{- range $v := $verbs }}{{- with (index $verbMap $v) }}{{- $actions = concat $actions . }}{{- end }}{{- end }}
            {{- $statements = list (dict "Effect" "Allow" "Action" ($actions | uniq) "Resource" ($resources | uniq)) }}
            {{- end }}
            oidc-policy-{{ $p.name }}.json: |
              {{ dict "Version" "2012-10-17" "Statement" $statements | toJson }}
            {{- end }}
            provision.sh: |
              #!/bin/sh
              set -eu
              echo ">> waiting for RustFS admin API at {{ $endpoint }} ..."
              until mc alias set rf "{{ $endpoint }}" "$ROOT_AK" "$ROOT_SK" >/dev/null 2>&1; do sleep 3; done
              echo ">> creating buckets"
              {{- range $b := $buckets }}
              mc mb --ignore-existing rf/{{ $b.name }}
              {{- if $b.anonymousRead }}
              mc anonymous set download rf/{{ $b.name }}
              {{- end }}
              {{- /* S3 has no real directories: consumers that require a prefix to already exist before they write anything to it (e.g. Spark's FsHistoryProvider,
                     which fails to even start if its configured log directory is absent) need an empty marker object created for it upfront. */ -}}
              {{- range $p := ($b.paths | default list) }}
              printf '' | mc pipe rf/{{ $b.name }}/{{ $p }}/.keep
              {{- end }}
              {{- end }}
              echo ">> creating users + policies from grants"
              {{- range $g := $grants }}
              {{- $verbs := list }}{{- range $v := ($g.actions | default list) }}{{- $verbs = append $verbs (lower $v) }}{{- end }}
              {{- $isAdmin := or ($g.sts | default false) (has "admin" $verbs) }}
              {{- $ak := printf "G_%s_AK" $g.principal }}
              {{- $sk := printf "G_%s_SK" $g.principal }}
              # grant: {{ $g.principal }}{{ if $isAdmin }} (admin/sts -> consoleAdmin){{ end }}
              mc admin user add rf "${{ $ak }}" "${{ $sk }}"
              {{- if $isAdmin }}
              mc admin policy attach rf consoleAdmin --user "${{ $ak }}" || true
              {{- else }}
              mc admin policy create rf okdp-{{ $g.principal }} /policies/policy-{{ $g.principal }}.json || true
              mc admin policy attach rf okdp-{{ $g.principal }} --user "${{ $ak }}" || true
              {{- end }}
              {{- end }}
              {{- if $oidcEnabled }}
              echo ">> registering the OIDC provider in the admin config store"
              mc admin config set rf identity_openid \
                enable=on \
                config_url="{{ $oidcDiscoveryUrl }}" \
                client_id="$OIDC_CLIENT_ID" \
                client_secret="$OIDC_CLIENT_SECRET" \
                scopes="{{ $oidcScopes }}" \
                redirect_uri="https://{{ $consoleHost }}/rustfs/admin/v3/oidc/callback/default" \
                redirect_uri_dynamic=off \
                display_name="{{ $oidcDisplayName }}" \
                claim_name="{{ $oidcPolicyClaim }}" groups_claim="{{ $oidcPolicyClaim }}" \
                username_claim=preferred_username email_claim=email
              {{- end }}
              {{- if $oidcPolicies }}
              echo ">> creating OIDC policies (claim values map onto these names)"
              {{- range $p := $oidcPolicies }}
              mc admin policy create rf {{ $p.name }} /policies/oidc-policy-{{ $p.name }}.json || true
              {{- end }}
              {{- end }}
              echo ">> provisioning complete"
        - apiVersion: batch/v1
          kind: Job
          metadata:
            name: {{ $release }}-provision
            namespace: {{ $ns }}
            annotations:
              # Jobs are immutable: re-run on every install/upgrade instead of
              # patching in place, so a rotated rootAccessKey/rootSecretKey
              # (or any other provisioning input) is always picked up. Must
              # run post-install/post-upgrade: the Deployment/Service it
              # polls are regular (non-hook) chart resources applied first.
              helm.sh/hook: post-install,post-upgrade
              helm.sh/hook-delete-policy: before-hook-creation
          spec:
            backoffLimit: 20
            template:
              metadata:
                name: {{ $release }}-provision
              spec:
                restartPolicy: OnFailure
                containers:
                  - name: mc
                    image: "{{ .Parameters.mcImage }}"
                    command: ["/bin/sh", "/scripts/provision.sh"]
                    env:
                      - name: ROOT_AK
                        valueFrom: { secretKeyRef: { name: {{ $rootSecret }}, key: RUSTFS_ACCESS_KEY } }
                      - name: ROOT_SK
                        valueFrom: { secretKeyRef: { name: {{ $rootSecret }}, key: RUSTFS_SECRET_KEY } }
                      {{- if $oidcEnabled }}
                      - name: OIDC_CLIENT_ID
                        valueFrom: { secretKeyRef: { name: {{ $oauthSecret }}, key: client_id } }
                      - name: OIDC_CLIENT_SECRET
                        valueFrom: { secretKeyRef: { name: {{ $oauthSecret }}, key: client_secret } }
                      {{- end }}
                      {{- range $g := $grants }}
                      - name: G_{{ $g.principal }}_AK
                        valueFrom: { secretKeyRef: { name: {{ $g.credentialsSecret.name }}, key: {{ $g.credentialsSecret.accessKeyKey }} } }
                      - name: G_{{ $g.principal }}_SK
                        valueFrom: { secretKeyRef: { name: {{ $g.credentialsSecret.name }}, key: {{ $g.credentialsSecret.secretKeyKey }} } }
                      {{- end }}
                    volumeMounts:
                      - name: scripts
                        mountPath: /scripts
                      - name: policies
                        mountPath: /policies
                volumes:
                  - name: scripts
                    configMap:
                      name: {{ $release }}-provision
                      items:
                        - key: provision.sh
                          path: provision.sh
                  - name: policies
                    configMap:
                      name: {{ $release }}-provision

# apiUrl external ingress, internalUrl in-cluster, consoleUrl web console.
# No secretRef: consumers bring their own identity through the grants.
outputs: |
  {{- $host := printf "%s-%s" (trimPrefix (printf "%s-" .Release.spec.targetNamespace) .Release.metadata.name) .Release.spec.targetNamespace -}}
  - name: s3
    contract: s3
    values:
      apiUrl: "https://{{ $host }}-api.{{ .Context.ingress.suffix }}"
      internalUrl: "http://{{ .Release.metadata.name }}-svc.{{ .Release.spec.targetNamespace }}.svc.cluster.local:9000"
      consoleUrl: "https://{{ $host }}.{{ .Context.ingress.suffix }}"
      region: us-east-1
      # RustFS serves buckets by path in a single-node sandbox: no per-bucket DNS.
      pathStyle: true

roles:
  - storage
dependencies:
  - ingress
