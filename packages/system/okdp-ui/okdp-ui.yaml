# OKDP web console (new UI), packaged from the alex-mabrouk fork (branch
# feat/identity-capabilities) pending upstream integration. The console is a
# static Vite bundle served by nginx; its ingress routes /api to the
# in-cluster okdp-server Service so the browser stays same-origin (no CORS).
#
# The OIDC client is resolved at runtime from GET /api/capabilities (Context
# identity.oidc); the values baked into the bundle only serve as a fallback
# for legacy or unreachable servers.
apiVersion: v1alpha1
name: okdp-ui
tag: 0.6.0-p03
protected: false
description: |
  OKDP UI (new console) - Web interface for the Open Kubernetes Data Platform
usage:
  text: |
    Access the console at https://okdp-ui.{{ .Context.platform.ingress.suffix }}
schema:
  parameters:
    properties:
      backendService:
        type: string
        default: "okdp-server-main"
        description: "In-cluster okdp-server Service name (must resolve in the release namespace)"
  context:
    properties:
      platform:
        required: true
        properties:
          ingress:
            required: true
            properties:
              suffix: { type: string, required: true }
          certificateIssuers:
            required: true
            properties:
              selfSigned:
                properties:
                  name: { type: string, required: true }
modules:
  - name: main
    timeout: 10m
    source:
      oci:
        repository: ghcr.io/alex-mabrouk/okdp-charts/okdp-ui
        tag: 0.6.0
    values: |
      image:
        repository: ghcr.io/alex-mabrouk/okdp-images/okdp-ui
        tag: "0.6.1"
        pullPolicy: Always

      backend:
        service: {{ .Parameters.backendService }}
        port: 8093

      ingress:
        className: nginx
        # Takes over the host of the legacy console it replaces.
        host: okdp-ui.{{ .Context.platform.ingress.suffix }}
        clusterIssuer: {{ .Context.platform.certificateIssuers.selfSigned.name }}
        tlsSecretName: okdp-ui-tls

roles:
  - okdp-ui
dependencies:
  - ingress
