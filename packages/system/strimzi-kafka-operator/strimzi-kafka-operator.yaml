# Cluster-wide operator for the Kafka, KafkaNodePool, KafkaUser and KafkaTopic
# CRDs. Kafka packages (e.g. `kafka`) depend on this being installed first via
# the `strimziKafkaOperator` role.

apiVersion: v1alpha1
name: strimzi-kafka-operator
tag: 1.2.0-p01
protected: true
description: |
  Strimzi Kafka Operator: runs Apache Kafka in KRaft mode on Kubernetes, with native SASL/SCRAM
  and TLS support via the Kafka, KafkaNodePool, KafkaUser and KafkaTopic CRDs.
usage:
  text: |
    The operator watches every namespace for Kafka/KafkaNodePool/KafkaUser/KafkaTopic resources.
    Projects deploying the `kafka` package get their broker provisioned here.
schema:
  parameters:
    properties: {}
  context:
    properties: {}
modules:
  - name: main
    timeout: 10m
    source:
      helmRepository:
        url: https://strimzi.io/charts/
        chart: strimzi-kafka-operator
        version: "1.2.0"
    values: |
      watchAnyNamespace: true
    # helm upgrade never touches CRDs (Helm limitation) — force Flux to keep
    # Kafka/KafkaNodePool/KafkaUser/KafkaTopic CRDs in sync on every reconcile.
    specPatch: |
      install:
        crds: CreateReplace
      upgrade:
        crds: CreateReplace
roles:
  - strimziKafkaOperator
dependencies: []
