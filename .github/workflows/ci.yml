name: ci

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - "**/**"
      - "!README.md"
      - "!**/README.md"
      - "!docs/**"

  push:
    branches:
      - '**'
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - "**/**"
      - "!README.md"
      - "!**/README.md"
      - "!docs/**"

  workflow_dispatch:

permissions:
  packages: write
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  get-package-oci-prefix:
    runs-on: ubuntu-latest
    outputs:
      oci_package_prefix: ${{ steps.prefix.outputs.oci_package_prefix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get OCI package prefix
        id: prefix
        uses: ./.github/actions/oci-package-prefix
        with:
          values_path: okdp-packages-values.yaml

  kubocd-packages-ci:
    needs: [get-package-oci-prefix]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/kubocd-package-template.yml
    with:
      publish_to_registry: "false"
      oci_package_prefix: "${{ needs.get-package-oci-prefix.outputs.oci_package_prefix }}"
      runs-on: "ubuntu-latest"
